[workspace]
resolver = "2"
members = [
    "crates/megaberg",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-channel = "2"
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Iceberg / Parquet
apache-avro = "0.17"
parquet = "55"
arrow = "55"

# Iceberg catalog
iceberg = { version = "0.7", features = ["storage-s3"] }
iceberg-catalog-rest = "0.7"
iceberg-catalog-glue = "0.7"

# Storage
object_store = { version = "0.12", features = ["aws"] }
opendal = { version = "0.51", features = ["services-s3"] }

# Query engine
datafusion = "48"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# Time handling
chrono = "0.4"

# Encoding
hex = "0.4"

# Testing
tempfile = "3"
