services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: megaberg-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Create default bucket on startup
  minio-setup:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/warehouse --ignore-existing;
      echo 'Bucket warehouse created';
      "

volumes:
  minio_data:
