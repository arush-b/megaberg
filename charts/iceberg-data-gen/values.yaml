image:
  repository: gladium08/iceberg-data-gen
  tag: latest
  pullPolicy: IfNotPresent

# S3 configuration
s3:
  endpoint: "https://s3.us-east-1.amazonaws.com"
  bucket: "laminar-dev-iceberg"
  region: "us-east-1"
  # Credentials from secret (optional - can use IRSA on EKS)
  secretName: ""
  accessKeyKey: "access-key"
  secretKeyKey: "secret-key"

# Catalog configuration
catalog:
  # "rest" or "glue"
  type: "glue"
  # REST catalog settings
  uri: ""
  # Glue catalog settings
  catalogId: "792306802931"
  # Common
  warehouse: "s3://laminar-dev-iceberg/warehouse"

# Table configuration
table:
  namespace: "laminar_iceberg"
  name: "data_gen_test"

# Generation configuration
generate:
  totalSizeMb: 1024
  fileSizeKb: 10
  parallelism: 16
  compression: "uncompressed"
  partitions:
    numAliases: 10
    workspacesPerAlias: 5
    clustersPerWorkspace: 2

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Service account for IRSA (AWS IAM Roles for Service Accounts)
serviceAccount:
  create: false
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
