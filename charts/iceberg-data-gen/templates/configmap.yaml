apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.json: |
    {
      "s3": {
        "endpoint": {{ .Values.s3.endpoint | quote }},
        "bucket": {{ .Values.s3.bucket | quote }},
        "region": {{ .Values.s3.region | quote }}
      },
      "catalog": {
        {{- if eq .Values.catalog.type "rest" }}
        "type": "rest",
        "uri": {{ .Values.catalog.uri | quote }},
        "warehouse": {{ .Values.catalog.warehouse | quote }}
        {{- else if eq .Values.catalog.type "glue" }}
        "type": "glue",
        "warehouse": {{ .Values.catalog.warehouse | quote }}
        {{- if .Values.catalog.catalogId }},
        "catalog_id": {{ .Values.catalog.catalogId | quote }}
        {{- end }}
        {{- end }}
      },
      "table": {
        "namespace": {{ .Values.table.namespace | quote }},
        "name": {{ .Values.table.name | quote }}
      },
      "generate": {
        "total_size_mb": {{ .Values.generate.totalSizeMb }},
        "file_size_kb": {{ .Values.generate.fileSizeKb }},
        "parallelism": {{ .Values.generate.parallelism }},
        "compression": {{ .Values.generate.compression | quote }},
        "partitions": {
          "num_aliases": {{ .Values.generate.partitions.numAliases }},
          "workspaces_per_alias": {{ .Values.generate.partitions.workspacesPerAlias }},
          "clusters_per_workspace": {{ .Values.generate.partitions.clustersPerWorkspace }}
        }
      }
    }
