image:
  repository: gladium08/compaction
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: laminar-query-history

configPath: /config/config.json

config:
  worker_count: 4
  s3:
    endpoint: "https://s3.us-east-1.amazonaws.com"
    access_key: ""
    secret_key: ""
    bucket: "laminar-dev"
    region: "us-east-1"
  catalog:
    type: "glue"
    warehouse: "s3://laminar-dev/warehouse"
    region: "us-east-1"
  table:
    namespace: "laminar_iceberg"
    name: "laminar_shreyas_compaction"
  compaction:
    target_file_size_mb: 256
    min_files_per_partition: 2
    target_file_size_bytes: 268435456
    row_group_size: 300000
    multipart_chunk_bytes: 67108864
    compression: "none"
    batch_size: 8192
    memory_limit_bytes: 536870912

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2"

nodeSelector: {}
tolerations: []
affinity: {}
