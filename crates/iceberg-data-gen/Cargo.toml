[package]
name = "iceberg-data-gen"
version = "0.1.0"
edition = "2021"

[lib]
name = "iceberg_data_gen"
path = "src/lib.rs"

[[bin]]
name = "iceberg-data-gen"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
iceberg = { workspace = true, features = ["storage-s3"] }
iceberg-catalog-rest = { workspace = true }
iceberg-catalog-glue = { workspace = true }
arrow = { workspace = true, features = ["prettyprint"] }
parquet = { workspace = true }
rand = "0.8"
uuid = { version = "1.10", features = ["v4", "fast-rng", "macro-diagnostics"] }
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opendal = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["minio"] }
reqwest = { workspace = true }
aws-sdk-s3 = "1"
aws-config = "1"
