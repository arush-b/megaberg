name: CI

on: [push, pull_request]

jobs:
  build-rust:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-arm64
    env:
      DATABASE_URL: "postgres://laminar:laminar@localhost:5432/laminar"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, rustfmt
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "laminar-build"
          cache-on-failure: true
      - name: Check Formatting
        run: cargo fmt -- --check
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.12'
      - name: Setup Postgres
        run: |
          sudo apt-get update
          sudo apt-get install postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER laminar WITH PASSWORD 'laminar' SUPERUSER;"
          sudo -u postgres createdb laminar
          cargo install refinery_cli
          refinery migrate -e DATABASE_URL -p crates/laminar-api/migrations
      - name: Install dependencies
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          sudo apt-get install -y cmake clang ruby unzip postgresql libsasl2-dev protobuf-compiler
      - name: Install CI tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo install cargo-machete --locked
          cargo install cargo-llvm-cov --locked
      - name: Build
        run: cargo build --all-features
      - name: Run Clippy
        run: cargo clippy --all-features --all-targets --workspace -- -D warnings
      - name: Security Audit
        run: |
          cargo audit
      - name: Check Dependencies
        run: |
          cargo deny check bans sources
          cargo machete
        continue-on-error: true
      - name: Build Documentation
        run: cargo doc --no-deps --all-features --workspace
      - name: Test with Coverage
        run: |
          cargo llvm-cov nextest --all-features -E 'kind(lib)' --lcov --output-path lcov.info
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}